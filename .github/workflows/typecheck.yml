name: TypeScript checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Compile Next.js routes (without live database)
        run: npm run build -- --experimental-build-mode compile
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
